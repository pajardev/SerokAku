<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SerokAku</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: #0a0a0a;
  color: white;
  overflow-x: hidden;
}

header {
  position: fixed;
  width: 100%;
  top: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 30px;
  z-index: 1000;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(12px);
}

.logo {
  font-size: 1.5rem;
  font-weight: bold;
  letter-spacing: 2px;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 15px;
  font-size: 1.3rem;
  transition: 0.3s;
}

nav a:hover {
  color: gold;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  flex-direction: column;
  background: radial-gradient(circle at center, #111, #000);
}

/* GAMBAR */
.hero img {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 50%;
  margin-bottom: 20px;
  border: 2px solid gold;
}

.hero h1 {
  font-size: 3.5rem;
  background: linear-gradient(90deg, red,gold);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
}

.hero p {
  opacity: 0.7;
  margin-bottom: 30px;
}

section {
  padding: 100px 20px;
  text-align: center;
}

.cards {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  margin: 10px;
  padding: 25px;
  width: 260px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  transition: 0.4s;
}

.card:hover {
  transform: translateY(-10px) scale(1.05);
  border-color: gold;
}

</style>

<style>
/* ANIMASI MELAYANG */
@keyframes floatUpDown {
  0% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-15px);
  }
  100% {
    transform: translateY(0);
  }
}

/* ANIMASI KEDIP */
@keyframes blinkText {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.2;
  }
}

/* TERAPKAN KE H1 */
.hero h1 {
  font-size: 3.5rem;
  background: linear-gradient(90deg, cyan,blue);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;

  animation: floatUpDown 3s ease-in-out infinite;
}

/* TERAPKAN KE TEKS BAWAH */
.hero i {
  animation: blinkText 2s infinite;
}
</style>

<!-- ICON (Font Awesome) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header>
  <div class="logo">IQ</div>
  <nav>
    <a href="https://wa.me/6285758036578" target="_blank">
      <i class="fab fa-whatsapp"></i>
    </a>
    <a href="https://instagram.com/paper_motivational" target="_blank">
      <i class="fab fa-instagram"></i>
    </a>
  </nav>
</header>

<section class="hero">

  <!-- GAMBAR -->
  <img src="lambo.jpg" alt="Logo">

  <h1>Website IQ</h1>
  <i><b>Selamat Datang Di website IQ</b></i>

</section>

<section>
  <h2>Layanan</h2>
  <div class="cards" id="cards"></div>
</section>

<script>
const data = ["Promosi Vidio", "Jasa Caption", "Jual Sticker"];
const cards = document.getElementById("cards");

data.forEach(item => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `<h3>${item}</h3><p>Layanan ${item}</p>`;
  cards.appendChild(div);
});

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.style.opacity = 1;
      entry.target.style.transform = "translateY(0)";
    } else {
      entry.target.style.opacity = 0;
      entry.target.style.transform = "translateY(60px)";
    }
  });
}, { threshold: 0.2 });

document.querySelectorAll("section, .card").forEach(el => {
  el.style.opacity = 0;
  el.style.transform = "translateY(60px)";
  el.style.transition = "all 0.8s ease";
  observer.observe(el);
});

window.addEventListener("scroll", () => {
  const scrollY = window.scrollY;
  document.querySelector(".hero").style.transform = `translateY(${scrollY * 0.3}px)`;
});
</script>
<script src="https://unpkg.com/snowfalljs/dist/snowfall.min.js"></script>
<center>

<div class="cta">
  <b>
    Jika berminat, silakan hubungi kontak Instagram / WhatsApp di atas.<br>
    Jangan lupa follow Instagram kami Agar Kamu Sukses Terus.
  </b>
</div>
<style>
.cta {
  text-align: center;
  padding: 30px 20px;
  font-size: 1rem;
  line-height: 1.6;
  color: #ddd;
  opacity: 0.9;
}

.cta b {
  background: linear-gradient(90deg, gold, orange);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
</style>
</center>
</body>
</html>
